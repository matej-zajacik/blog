<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>{{ page.title }}</title>
	<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>

<body>
	<header class="navbar">
		<h1>My Cool Blog</h1>
	</header>

	<main class="container">
		<div class="content">
			{{ content }}
		</div>
		<div class="post_list">
			<ul>
				{% for post in site.posts %}
				<li>
					<a href="{{post.url}}">{{post.title}}</a>
				</li>
				<small>{{post.date | date: "%Y-%m-%d"}}</small>
				{% endfor %}
			</ul>
		</div>
	</main>

	<footer>
		© 2026 Me
	</footer>
</body>
</html>
